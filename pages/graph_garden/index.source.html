<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Graph Garden</title>
<link rel="icon" type="image/jpeg" href="../../assets/images/logo-blue.jpeg">
<link rel="apple-touch-icon" href="../../assets/images/icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#14532d">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Nunito', sans-serif;
  background: radial-gradient(ellipse at 50% 18%, #2e8b57 0%, #14532d 58%, #0a2e19 100%);
}

.fit-stage { position: fixed; inset: 0; overflow: hidden; }
.game-wrap {
  width: 960px;
  height: 540px;
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

/* ── SCREENS ── */
.screen {
  display: none;
  position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 2;
}
.screen.active { display: flex; }
#screen-game.active { display: flex; gap: 0; justify-content: flex-start; }

/* ── MENU ── */
.menu-icon { font-size: 50px; animation: gg-float 2.6s ease-in-out infinite; }
@keyframes gg-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.menu-title {
  font-family: 'Fredoka One', cursive;
  font-size: 52px; color: #ffe040; letter-spacing: 1px; text-align: center;
  text-shadow: 0 4px 0 #14532d, 0 10px 26px rgba(46,139,87,.5);
}
.menu-sub { font-family: 'Patrick Hand', cursive; font-size: 26px; color: #b7f0c4; }
.howto {
  background: rgba(255,255,255,.07);
  border: 2px solid rgba(120,210,150,.5);
  border-radius: 18px; padding: 14px 28px;
  display: flex; flex-direction: column; gap: 7px; max-width: 680px;
}
.howto p { color: #e4ffec; font-size: 17px; font-weight: 700; }

.big-btn {
  font-family: 'Fredoka One', cursive; font-size: 24px;
  color: #14532d; background: linear-gradient(135deg, #7ee0a0, #2faa66);
  border: none; border-radius: 999px; padding: 14px 52px; cursor: pointer;
  box-shadow: 0 7px 0 #1c6e3e, 0 14px 30px rgba(0,0,0,.45);
  transition: transform .12s, box-shadow .12s;
}
.big-btn:hover { transform: translateY(-2px); }
.big-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #1c6e3e, 0 8px 18px rgba(0,0,0,.4); }
.big-btn.small { font-size: 18px; padding: 10px 28px; box-shadow: 0 5px 0 #1c6e3e, 0 10px 22px rgba(0,0,0,.4); }
.big-btn.small:active { box-shadow: 0 2px 0 #1c6e3e, 0 6px 14px rgba(0,0,0,.35); }
.big-btn.alt { background: linear-gradient(135deg, #ffd45a, #e0962e); color: #4a3110; box-shadow: 0 5px 0 #9a6a1e, 0 10px 22px rgba(0,0,0,.4); }
.big-btn.alt:active { box-shadow: 0 2px 0 #9a6a1e, 0 6px 14px rgba(0,0,0,.35); }
.big-btn.ghost { background: rgba(255,255,255,.12); color: #e4ffec; border: 2px solid rgba(255,255,255,.3); box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 10px 22px rgba(0,0,0,.35); }
.big-btn.ghost:active { box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.3); }

/* ── LEVEL SELECT ── */
.lvl-title {
  font-family: 'Fredoka One', cursive; font-size: 36px; color: #ffe040;
  text-shadow: 0 3px 0 #14532d;
}
.lvl-grid { display: flex; gap: 16px; }
.lvl-card {
  width: 184px;
  background: rgba(255,255,255,.07);
  border: 2.5px solid rgba(120,210,150,.55);
  border-radius: 20px; padding: 16px 10px;
  text-align: center; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
  transition: transform .15s, border-color .15s, background .15s;
}
.lvl-card:hover { transform: translateY(-5px); border-color: #ffe040; background: rgba(255,255,255,.12); }
.lvl-mission { font-size: 12px; font-weight: 800; color: #b7f0c4; letter-spacing: 1.5px; text-transform: uppercase; }
.lvl-name { font-family: 'Fredoka One', cursive; font-size: 21px; color: #fff; }
.lvl-tag { font-family: 'Fredoka One', cursive; font-size: 14px; color: #ffe040; direction: ltr; }
.lvl-stars { font-size: 18px; letter-spacing: 2px; }
.star-off { color: rgba(255,255,255,.28); }
.lvl-lock-hint { font-size: 12px; color: #ffc0a0; font-weight: 700; }
.lvl-card.locked { opacity: .5; cursor: not-allowed; filter: grayscale(.55); }
.lvl-card.locked:hover { transform: none; border-color: rgba(120,210,150,.55); background: rgba(255,255,255,.07); }

/* ── GAME SCREEN ── */
.hud {
  width: 100%; height: 58px; flex: 0 0 58px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 16px;
  background: rgba(10,46,25,.6);
  border-bottom: 2px solid rgba(120,210,150,.4);
  z-index: 5;
}
.hud-group { display: flex; align-items: center; gap: 12px; }
.hud-q {
  font-family: 'Fredoka One', cursive; font-size: 21px; color: #fff;
  background: linear-gradient(135deg, #2faa66, #1c6e3e);
  padding: 6px 24px; border-radius: 999px;
  box-shadow: 0 3px 12px rgba(0,0,0,.45);
  text-align: center; max-width: 640px;
}
.hud-q b { color: #ffe040; }
.hud-progress { font-family: 'Fredoka One', cursive; font-size: 17px; color: #b7f0c4; direction: ltr; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid rgba(120,210,150,.6);
  background: rgba(255,255,255,.08); color: #fff;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: rgba(255,255,255,.18); }

/* ── PLAY AREA ── */
.play {
  flex: 1 1 auto; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 10px;
}

/* CHART (bar + pictograph share a baseline grid) */
.chart {
  display: flex; gap: 26px; align-items: flex-end; justify-content: center;
  min-height: 250px; padding: 14px 26px 10px;
  border-radius: 18px; background: rgba(255,255,255,.06);
  border: 2px solid rgba(120,210,150,.4);
  border-bottom: 4px solid rgba(120,210,150,.7);
}
.cat { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; }
.cat-col { display: flex; flex-direction: column-reverse; align-items: center; height: 200px; justify-content: flex-start; }
/* bar */
.bar {
  width: 52px; border-radius: 8px 8px 0 0;
  background: linear-gradient(180deg, #7ee0a0, #2faa66);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
  transition: height .25s ease;
}
.bar-val { font-family: 'Fredoka One', cursive; font-size: 18px; color: #ffe040; }
.cat-icon { font-size: 30px; }
.cat-name { font-size: 13px; font-weight: 800; color: #e4ffec; }
/* pictograph units */
.picto { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; height: 200px; justify-content: flex-start; }
.picto .unit { font-size: 24px; line-height: 1; }
.picto .half { opacity: .55; clip-path: inset(0 50% 0 0); }

.chart-key {
  font-size: 14px; font-weight: 800; color: #ffe040; direction: ltr;
}

/* build-mode bar controls */
.cat-btns { display: flex; gap: 6px; margin-top: 4px; }
.step-btn {
  width: 40px; height: 40px; border-radius: 11px; border: none;
  font-family: 'Fredoka One', cursive; font-size: 24px; color: #14532d;
  background: linear-gradient(135deg, #7ee0a0, #2faa66); cursor: pointer;
  box-shadow: 0 4px 0 #1c6e3e; line-height: 1;
}
.step-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c6e3e; }
.step-btn.minus { background: linear-gradient(135deg, #f0a0a0, #c05050); color: #fff; box-shadow: 0 4px 0 #7a2a2a; }
.step-btn.minus:active { box-shadow: 0 1px 0 #7a2a2a; }
.step-btn:disabled { opacity: .4; cursor: default; }
.cat.target .cat-col { outline: 3px dashed #ffe040; outline-offset: 4px; border-radius: 8px; }

.check-btn {
  font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff;
  background: linear-gradient(135deg, #2ecc71, #1e8e4f);
  border: none; border-radius: 999px; padding: 11px 40px; cursor: pointer;
  box-shadow: 0 6px 0 #145e34, 0 10px 22px rgba(0,0,0,.4);
}
.check-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #145e34; }

/* answer choices */
.choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.choice {
  font-family: 'Fredoka One', cursive; font-size: 26px; color: #14532d;
  min-width: 120px; padding: 14px 18px; border-radius: 16px; border: none;
  background: linear-gradient(135deg, #7ee0a0, #2faa66); cursor: pointer;
  box-shadow: 0 6px 0 #1c6e3e;
}
.choice:active { transform: translateY(3px); box-shadow: 0 3px 0 #1c6e3e; }
.choice.good { background: linear-gradient(135deg, #ffd45a, #e0962e); color: #4a3110; box-shadow: 0 6px 0 #9a6a1e; }
.choice.bad  { background: linear-gradient(135deg, #aaa, #777); color: #fff; box-shadow: 0 6px 0 #444; }
.choice:disabled { cursor: default; }

.toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-family: 'Fredoka One', cursive; font-size: 60px;
  pointer-events: none; opacity: 0; z-index: 30;
  text-shadow: 0 4px 0 rgba(0,0,0,.4);
}
.toast.show { animation: gg-toast 0.9s ease-out; }
@keyframes gg-toast {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
}

/* ── WIN PANEL ── */
.panel {
  background: rgba(8,40,22,.93);
  border: 3px solid rgba(120,210,150,.65);
  border-radius: 26px; padding: 28px 48px;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.panel-title {
  font-family: 'Fredoka One', cursive; font-size: 38px; color: #ffe040;
  text-shadow: 0 3px 0 #14532d;
}
.panel-stars { font-size: 46px; letter-spacing: 8px; }
.panel-line { font-size: 19px; font-weight: 800; color: #e4ffec; }
.panel-line.gold { color: #ffe040; }
.panel-btns { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }

/* ── PAUSE MODAL ── */
.modal {
  display: none; position: absolute; inset: 0; z-index: 50;
  background: rgba(4,20,10,.66);
  align-items: center; justify-content: center;
}
.modal.show { display: flex; }

/* ── SMART GO BADGE ── */
.sg-badge {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: max(12px, env(safe-area-inset-left));
  display: inline-flex;
  align-items: center;
  padding: 8px 18px;
  background: rgba(10, 26, 56, .85);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-radius: 999px;
  border: 1px solid rgba(30, 228, 214, .3);
  text-decoration: none;
  z-index: 9999;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.sg-badge:hover {
  transform: translateY(-1px) scale(1.05);
  box-shadow: 0 10px 28px rgba(0,0,0,.5);
  border-color: rgba(30, 228, 214, .6);
}
.sg-badge .sg-name {
  font-family: 'Fredoka One', cursive;
  font-size: 15px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #5af4e6, #18d0a8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ── LANGUAGE TOGGLE ── */
.lang-toggle {
  position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 9999;
  display: inline-flex; gap: 2px;
  background: rgba(10, 26, 56, .85);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid rgba(30, 228, 214, .3);
  border-radius: 999px; padding: 4px;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
[dir="rtl"] .lang-toggle { right: auto; left: max(12px, env(safe-area-inset-left)); }
[dir="rtl"] .sg-badge   { left: auto; right: max(12px, env(safe-area-inset-right)); }
.lang-toggle button {
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px;
  min-width: 34px; padding: 5px 11px; border: none; border-radius: 999px;
  background: transparent; color: rgba(255,255,255,.6); cursor: pointer;
  transition: background .18s, color .18s;
}
.lang-toggle button.active {
  background: linear-gradient(90deg, #5af4e6, #18d0a8); color: #0d1b35;
}
</style>
</head>
<body>
<a href="../" class="sg-badge" aria-label="Smart Go — back to gallery"><span class="sg-name">SMART GO</span></a>
<div class="lang-toggle" id="lang-toggle">
  <button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">ع</button>
</div>
<div class="fit-stage"><div class="game-wrap">

<!-- ══════════════════ MENU ══════════════════ -->
<div id="screen-menu" class="screen active">
  <div class="menu-icon">📊</div>
  <h1 class="menu-title" data-i18n="title">Graph Garden</h1>
  <div class="menu-sub" data-i18n="subtitle">Read the garden graphs!</div>
  <div class="howto">
    <p data-i18n="how.1">🌻 Look at the chart of flowers and fruit.</p>
    <p data-i18n="how.2">❓ Answer the question — how many, which is most, how many more?</p>
    <p data-i18n="how.3">🌱 In Build mode, tap + and − to grow the bar to the right height!</p>
  </div>
  <button class="big-btn" onclick="goLevels()" data-i18n="btn.start">Start</button>
</div>

<!-- ══════════════════ LEVEL SELECT ══════════════════ -->
<div id="screen-level" class="screen">
  <h2 class="lvl-title" data-i18n="level.title">Choose a Mission</h2>
  <div class="lvl-grid" id="lvl-grid"></div>
</div>

<!-- ══════════════════ GAME ══════════════════ -->
<div id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-group">
      <span class="hud-q" id="hud-q">How many sunflowers?</span>
    </div>
    <div class="hud-group">
      <span class="hud-progress" id="hud-progress">0 / 6</span>
      <button class="icon-btn" id="btn-sound" onclick="toggleSound()" data-i18n-title="sound.on" title="Sound on">🔊</button>
      <button class="icon-btn" onclick="togglePause()" data-i18n-title="pause.title" title="Paused">⏸</button>
    </div>
  </div>
  <div class="play" id="play"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- ══════════════════ WIN ══════════════════ -->
<div id="screen-win" class="screen">
  <div class="panel">
    <div class="panel-title" id="win-title">Mission Complete!</div>
    <div class="panel-stars" id="win-stars">⭐⭐⭐</div>
    <div class="panel-line" id="win-correct"></div>
    <div class="panel-line gold" id="win-mistakes"></div>
    <div class="panel-btns">
      <button class="big-btn small" onclick="replayLevel()" data-i18n="btn.replay">Play Again</button>
      <button class="big-btn small alt" id="btn-next" onclick="nextMission()">Next Mission</button>
      <button class="big-btn small ghost" onclick="toMenu()" data-i18n="btn.menu">Menu</button>
    </div>
  </div>
</div>

<!-- ══════════════════ PAUSE MODAL ══════════════════ -->
<div id="pause-modal" class="modal">
  <div class="panel">
    <div class="panel-title" data-i18n="pause.title">Paused</div>
    <div class="panel-btns">
      <button class="big-btn small" onclick="resumeGame()" data-i18n="btn.resume">Resume</button>
      <button class="big-btn small ghost" onclick="quitToLevels()" data-i18n="btn.quit">Quit to Menu</button>
    </div>
  </div>
</div>

</div></div><!-- /.game-wrap /.fit-stage -->

<script>

  };

  let lang = localStorage.getItem(LANG_KEY) || 'en';
  if (lang !== 'en' && lang !== 'ar') lang = 'en';
  window.SGLANG = lang;

  window.t = function (key, vars) {
    let s = (I18N[lang] && I18N[lang][key] != null) ? I18N[lang][key]
          : (I18N.en[key] != null ? I18N.en[key] : key);
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  };

  function applyStatic() {
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = window.t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.title = window.t(el.getAttribute('data-i18n-title'));
    });
    document.querySelectorAll('#lang-toggle button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
  }

  function refreshDynamic() {
    const active = id => {
      const el = document.getElementById(id);
      return el && el.classList.contains('active');
    };
    if (typeof buildLevelCards === 'function' && active('screen-level')) buildLevelCards();
    if (typeof renderWin === 'function' && active('screen-win')) renderWin();
    if (typeof rerenderQuestion === 'function' && active('screen-game')) rerenderQuestion();
  }

  window.setLang = function (l) {
    if (l !== 'en' && l !== 'ar') return;
    lang = l; window.SGLANG = l;
    localStorage.setItem(LANG_KEY, l);
    applyStatic();
    refreshDynamic();
  };

  document.addEventListener('DOMContentLoaded', () => {
    const tog = document.getElementById('lang-toggle');
    if (tog) tog.addEventListener('click', e => {
      const b = e.target.closest('button[data-lang]');
      if (b) window.setLang(b.getAttribute('data-lang'));
    });
    applyStatic();
  });
  applyStatic();
})();
</script>

<script>
// ── UTILS ─────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── AUDIO ─────────────────────────────────────────────────────
let audioCtx = null, soundOn = true;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
}
function playTone(freq, dur, type) {
  if (!soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function sfxClick()  { playTone(520, 0.05, 'sine'); }
function sfxGrow()   { playTone(440, 0.05, 'square'); setTimeout(() => playTone(620, 0.05, 'square'), 40); }
function sfxRemove() { playTone(380, 0.05, 'sine'); }
function sfxCorrect(){ playTone(660, 0.1, 'triangle'); setTimeout(() => playTone(990, 0.16, 'triangle'), 90); }
function sfxWrong()  { playTone(240, 0.16, 'sawtooth'); setTimeout(() => playTone(160, 0.24, 'sawtooth'), 130); }
function sfxWin()    { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.22, 'triangle'), i * 120)); }
function toggleSound() {
  soundOn = !soundOn;
  const b = document.getElementById('btn-sound');
  b.textContent = soundOn ? '🔊' : '🔇';
  b.title = window.t(soundOn ? 'sound.on' : 'sound.off');
  if (soundOn) sfxClick();
}

// ── CONFIG ────────────────────────────────────────────────────
const ITEMS = {
  sunflower: '🌻', rose: '🌹', tulip: '🌷', daisy: '🌼', apple: '🍎', cherry: '🍒',
};
// chart: 'bar' | 'picto'. qTypes: which question kinds. build: include build questions. keyN: icons-per-unit.
const LEVELS = [
  { chart: 'picto', cats: 3, maxV: 6,  qTypes: ['howmany', 'most', 'least'],            build: false, keyN: 1, goal: 6 },
  { chart: 'bar',   cats: 3, maxV: 8,  qTypes: ['howmany', 'most', 'least', 'total'],   build: false, keyN: 1, goal: 6 },
  { chart: 'bar',   cats: 4, maxV: 9,  qTypes: ['morethan', 'fewerthan', 'most'],       build: false, keyN: 1, goal: 6 },
  { chart: 'picto', cats: 3, maxV: 10, qTypes: ['howmany', 'most', 'morethan'],          build: true,  keyN: 2, goal: 6 },
];
const FLOWER_KEYS = ['sunflower', 'rose', 'tulip', 'daisy'];

// ── PROGRESS ──────────────────────────────────────────────────
const SAVE_KEY = 'graphGarden.progress';
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (p && typeof p === 'object') return Object.assign({ l1: 0, l2: 0, l3: 0, l4: 0 }, p);
  } catch (e) {}
  return { l1: 0, l2: 0, l3: 0, l4: 0 };
}
let PROG = loadProgress();
function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(PROG)); } catch (e) {}
}

// ── STATE ─────────────────────────────────────────────────────
const S = {
  levelIdx: 0,
  goal: 6, solved: 0, mistakes: 0,
  data: [],          // [{ key, icon, value }]
  q: null,           // { type, ... , answer, prompt }
  choices: [],
  buildState: null,  // build mode: { catIdx, current, target }
  questionLocked: false,
  running: false, paused: false,
};

// ── DATA GENERATION ───────────────────────────────────────────
const recentSig = [];
function genData(lv) {
  const keys = shuffle(FLOWER_KEYS.slice()).slice(0, lv.cats);
  // distinct-ish values, at least one clear max for most/least questions
  let vals, guard = 0, sig;
  do {
    vals = keys.map(() => randi(1, lv.maxV));
    sig = vals.join(',');
    guard++;
  } while ((!hasUniqueMax(vals) || !hasUniqueMin(vals) || recentSig.includes(sig)) && guard < 60);
  recentSig.push(sig);
  if (recentSig.length > 3) recentSig.shift();
  return keys.map((k, i) => ({ key: k, icon: ITEMS[k], value: vals[i] }));
}
function hasUniqueMax(vals) {
  const mx = Math.max.apply(null, vals);
  return vals.filter(v => v === mx).length === 1;
}
function hasUniqueMin(vals) {
  const mn = Math.min.apply(null, vals);
  return vals.filter(v => v === mn).length === 1;
}

function maxCat(data) { return data.reduce((a, b) => b.value > a.value ? b : a); }
function minCat(data) { return data.reduce((a, b) => b.value < a.value ? b : a); }

function nextQuestion() {
  const lv = LEVELS[S.levelIdx];
  S.data = genData(lv);
  S.buildState = null;
  S.questionLocked = false;

  // Decide build vs ask
  const doBuild = lv.build && Math.random() < 0.4;
  if (doBuild) {
    const catIdx = randi(0, S.data.length - 1);
    const target = S.data[catIdx].value;
    S.buildState = { catIdx, current: 0, target };
    S.q = { type: 'build', answer: target, item: S.data[catIdx].key };
  } else {
    const type = lv.qTypes[randi(0, lv.qTypes.length - 1)];
    S.q = buildAskQuestion(type, lv);
  }
  S.choices = (S.q.type === 'build') ? [] : makeChoices(S.q, lv);
  rerenderQuestion();
  updateHUD();
}

function buildAskQuestion(type, lv) {
  const data = S.data;
  if (type === 'howmany') {
    const c = data[randi(0, data.length - 1)];
    return { type, answer: c.value, item: c.key, numeric: true };
  }
  if (type === 'total') {
    return { type, answer: data.reduce((s, d) => s + d.value, 0), numeric: true };
  }
  if (type === 'most') {
    return { type, answer: maxCat(data).key, numeric: false };
  }
  if (type === 'least') {
    return { type, answer: minCat(data).key, numeric: false };
  }
  if (type === 'morethan' || type === 'fewerthan') {
    // pick two distinct categories with a clear difference
    const sorted = data.slice().sort((a, b) => b.value - a.value);
    const a = sorted[0], b = sorted[sorted.length - 1];   // biggest vs smallest → positive diff
    if (type === 'morethan') return { type, answer: a.value - b.value, aKey: a.key, bKey: b.key, numeric: true };
    return { type, answer: a.value - b.value, aKey: a.key, bKey: b.key, numeric: true };
  }
  return { type: 'howmany', answer: data[0].value, item: data[0].key, numeric: true };
}

function makeChoices(q, lv) {
  if (!q.numeric) {
    // category-name questions: choices are the category keys (shown as icons+names)
    return shuffle(S.data.map(d => d.key));
  }
  const ans = q.answer;
  const pool = [];
  const push = v => { if (Number.isInteger(v) && v >= 0 && v !== ans && !pool.includes(v)) pool.push(v); };
  shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 3]).forEach(push);
  const picked = pool.slice(0, 3);
  let guard = 0;
  while (picked.length < 3 && guard++ < 50) {
    const v = ans + randi(-4, 4);
    if (v >= 0 && v !== ans && !picked.includes(v)) picked.push(v);
  }
  return shuffle([ans].concat(picked));
}

// ── RENDER QUESTION ───────────────────────────────────────────
function itemName(key) { return window.t('item.' + key); }

function questionPrompt(q) {
  if (q.type === 'build') return window.t('q.build', { item: '<b>' + ITEMS[q.item] + '</b>', n: '<b>' + q.answer + '</b>' });
  if (q.type === 'howmany') return window.t('q.howmany', { item: '<b>' + ITEMS[q.item] + ' ' + itemName(q.item) + '</b>' });
  if (q.type === 'total') return window.t('q.total');
  if (q.type === 'most') return window.t('q.most');
  if (q.type === 'least') return window.t('q.least');
  if (q.type === 'morethan') return window.t('q.morethan', { a: ITEMS[q.aKey], b: ITEMS[q.bKey] });
  if (q.type === 'fewerthan') return window.t('q.fewerthan', { a: ITEMS[q.aKey], b: ITEMS[q.bKey] });
  return '';
}

function pictoHTML(d, lv) {
  const keyN = lv.keyN;
  const fullUnits = Math.floor(d.value / keyN);
  const remainder = d.value - fullUnits * keyN;
  let html = '';
  for (let i = 0; i < fullUnits; i++) html += '<span class="unit">' + d.icon + '</span>';
  if (remainder > 0) html += '<span class="unit half">' + d.icon + '</span>';
  return '<div class="picto">' + html + '</div>';
}

function chartHTML(lv, buildIdx) {
  const isBuild = buildIdx != null;
  // Build questions always render as bars (you grow a bar). Otherwise use the level's chart type.
  const asBar = isBuild || lv.chart === 'bar';
  const maxShown = Math.max(lv.maxV, 1);
  let html = '<div class="chart">';
  S.data.forEach((d, i) => {
    const isTarget = buildIdx === i;
    const shownVal = isTarget ? S.buildState.current : d.value;
    let colInner;
    if (asBar) {
      const h = Math.round((shownVal / maxShown) * 190);
      colInner = '<div class="bar-val">' + shownVal + '</div><div class="bar" style="height:' + h + 'px"></div>';
    } else {
      colInner = pictoHTML(d, lv);
    }
    html += '<div class="cat' + (isTarget ? ' target' : '') + '">' +
              '<div class="cat-col">' + colInner + '</div>' +
              '<div class="cat-icon">' + d.icon + '</div>' +
            '</div>';
  });
  html += '</div>';
  if (lv.chart === 'picto' && !isBuild) {
    html += '<div class="chart-key">' + window.t('key.each', { icon: S.data[0].icon, n: lv.keyN }) + '</div>';
  }
  return html;
}

function rerenderQuestion() {
  if (!S.running) return;
  const lv = LEVELS[S.levelIdx];
  const play = document.getElementById('play');
  document.getElementById('hud-q').innerHTML = questionPrompt(S.q);

  if (S.q.type === 'build') {
    const bi = S.buildState.catIdx;
    let html = chartHTML(lv, bi);
    html += '<div class="cat-btns">' +
              '<button class="step-btn minus" id="b-minus">−</button>' +
              '<button class="step-btn plus" id="b-plus">+</button>' +
              '<button class="check-btn" id="check-btn">' + window.t('btn.check') + '</button>' +
            '</div>';
    play.innerHTML = html;
    document.getElementById('b-minus').addEventListener('click', () => onBuildStep(-1));
    document.getElementById('b-plus').addEventListener('click', () => onBuildStep(1));
    document.getElementById('check-btn').addEventListener('click', onCheckBuild);
    updateBuildDisabled();
  } else {
    let html = chartHTML(lv, null);
    html += '<div class="choices">';
    if (S.q.numeric) {
      S.choices.forEach(v => { html += '<button class="choice" data-v="' + v + '">' + v + '</button>'; });
    } else {
      S.choices.forEach(k => {
        html += '<button class="choice" data-k="' + k + '">' + ITEMS[k] + '</button>';
      });
    }
    html += '</div>';
    play.innerHTML = html;
    play.querySelectorAll('.choice').forEach(b => {
      b.addEventListener('click', () => {
        if (S.q.numeric) onChoose(parseInt(b.dataset.v, 10), b);
        else onChooseKey(b.dataset.k, b);
      });
    });
  }
}

function updateBuildDisabled() {
  const lv = LEVELS[S.levelIdx];
  const minus = document.getElementById('b-minus');
  const plus = document.getElementById('b-plus');
  if (minus) minus.disabled = S.buildState.current <= 0;
  if (plus) plus.disabled = S.buildState.current >= lv.maxV;
}

// ── INTERACTION ───────────────────────────────────────────────
function showToast(txt) {
  const el = document.getElementById('toast');
  el.textContent = txt;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function onBuildStep(d) {
  if (S.questionLocked) return;
  const lv = LEVELS[S.levelIdx];
  const nc = S.buildState.current + d;
  if (nc < 0 || nc > lv.maxV) return;
  S.buildState.current = nc;
  if (d > 0) sfxGrow(); else sfxRemove();
  rerenderQuestion();
}
function onCheckBuild() {
  if (S.questionLocked) return;
  if (S.buildState.current === S.q.answer) {
    S.questionLocked = true;
    sfxCorrect(); showToast(window.t('fb.correct'));
    advanceAfterCorrect();
  } else {
    sfxWrong(); showToast(window.t('fb.wrong'));
    S.mistakes++;
  }
}
function onChoose(v, btn) {
  if (S.questionLocked) return;
  if (v === S.q.answer) {
    S.questionLocked = true; btn.classList.add('good');
    document.querySelectorAll('.choice').forEach(b => b.disabled = true);
    sfxCorrect(); showToast(window.t('fb.correct'));
    advanceAfterCorrect();
  } else {
    btn.classList.add('bad'); btn.disabled = true;
    sfxWrong(); showToast(window.t('fb.wrong')); S.mistakes++;
  }
}
function onChooseKey(k, btn) {
  if (S.questionLocked) return;
  if (k === S.q.answer) {
    S.questionLocked = true; btn.classList.add('good');
    document.querySelectorAll('.choice').forEach(b => b.disabled = true);
    sfxCorrect(); showToast(window.t('fb.correct'));
    advanceAfterCorrect();
  } else {
    btn.classList.add('bad'); btn.disabled = true;
    sfxWrong(); showToast(window.t('fb.wrong')); S.mistakes++;
  }
}
function advanceAfterCorrect() {
  S.solved++;
  updateHUD();
  setTimeout(() => {
    if (!S.running) return;
    if (S.solved >= S.goal) winLevel();
    else nextQuestion();
  }, 850);
}

// ── GAME FLOW ─────────────────────────────────────────────────
function goLevels() { ensureAudio(); sfxClick(); buildLevelCards(); showScreen('screen-level'); }
function toMenu()   { sfxClick(); buildLevelCards(); showScreen('screen-level'); }

function startLevel(idx) {
  S.levelIdx = idx; S.goal = LEVELS[idx].goal;
  S.solved = 0; S.mistakes = 0;
  S.running = true; S.paused = false;
  recentSig.length = 0;
  document.getElementById('pause-modal').classList.remove('show');
  nextQuestion();
  showScreen('screen-game');
}
function replayLevel() { sfxClick(); startLevel(S.levelIdx); }
function nextMission() {
  sfxClick();
  if (S.lastWin && S.lastWin.levelIdx < 3) startLevel(S.lastWin.levelIdx + 1);
  else { buildLevelCards(); showScreen('screen-level'); }
}

function winLevel() {
  S.running = false;
  const stars = S.mistakes === 0 ? 3 : S.mistakes <= 2 ? 2 : 1;
  const key = 'l' + (S.levelIdx + 1);
  if (stars > PROG[key]) { PROG[key] = stars; saveProgress(); }
  S.lastWin = { stars, correct: S.solved, goal: S.goal, mistakes: S.mistakes, levelIdx: S.levelIdx };
  renderWin();
  showScreen('screen-win');
  sfxWin();
}
function renderWin() {
  const w = S.lastWin;
  if (!w) return;
  document.getElementById('win-title').textContent = window.t('win.title.' + w.stars);
  document.getElementById('win-stars').innerHTML =
    '⭐'.repeat(w.stars) + '<span class="star-off">' + '★'.repeat(3 - w.stars) + '</span>';
  document.getElementById('win-correct').textContent = window.t('win.correct', { n: w.correct, g: w.goal });
  document.getElementById('win-mistakes').textContent =
    w.mistakes === 0 ? window.t('win.nomistakes') : window.t('win.mistakes', { n: w.mistakes });
  const nextBtn = document.getElementById('btn-next');
  if (w.levelIdx < 3) { nextBtn.style.display = ''; nextBtn.textContent = window.t('btn.next'); }
  else nextBtn.style.display = 'none';
}

// ── LEVEL SELECT CARDS ────────────────────────────────────────
function buildLevelCards() {
  const grid = document.getElementById('lvl-grid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const stars = PROG['l' + (i + 1)];
    const locked = i > 0 && PROG['l' + i] === 0;
    const card = document.createElement('div');
    card.className = 'lvl-card' + (locked ? ' locked' : '');
    card.innerHTML =
      '<div class="lvl-mission">' + window.t('level.mission', { n: i + 1 }) + '</div>' +
      '<div class="lvl-name">' + window.t('level.name.' + (i + 1)) + '</div>' +
      '<div class="lvl-tag">' + window.t('level.tag.' + (i + 1)) + '</div>' +
      (locked
        ? '<div class="lvl-stars">🔒</div><div class="lvl-lock-hint">' + window.t('level.locked') + '</div>'
        : '<div class="lvl-stars">' + '⭐'.repeat(stars) + '<span class="star-off">' + '★'.repeat(3 - stars) + '</span></div>');
    if (!locked) card.addEventListener('click', () => { ensureAudio(); sfxClick(); startLevel(i); });
    grid.appendChild(card);
  });
}

// ── HUD ───────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('hud-progress').textContent = S.solved + ' / ' + S.goal;
}

// ── PAUSE ─────────────────────────────────────────────────────
function togglePause() {
  if (!S.running || S.paused) return;
  S.paused = true;
  document.getElementById('pause-modal').classList.add('show');
}
function resumeGame() {
  sfxClick();
  S.paused = false;
  document.getElementById('pause-modal').classList.remove('show');
}
function quitToLevels() {
  sfxClick();
  S.paused = false; S.running = false;
  document.getElementById('pause-modal').classList.remove('show');
  buildLevelCards();
  showScreen('screen-level');
}

// ── BOOTSTRAP ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  updateHUD();
});

// Scale-to-fit
(function () {
  const baseW = 960, baseH = 540;
  function fitStage() {
    const wrap = document.querySelector('.game-wrap');
    if (!wrap) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const s = Math.min(vw / baseW, vh / baseH);
    const x = (vw - baseW * s) / 2;
    const y = (vh - baseH * s) / 2;
    wrap.style.transform = 'translate(' + x + 'px, ' + y + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  document.addEventListener('DOMContentLoaded', fitStage);
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js')
      .catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
