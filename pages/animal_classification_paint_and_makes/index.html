<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal Classification Paint &amp; Makes</title>
<link rel="icon" type="image/png" href="../../assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100dvh;margin:0;
  background:radial-gradient(ellipse at center,#FF8C28 0%,#E85500 100%);
  font-family:'Fredoka One',cursive;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.fit-stage{
  position:fixed;inset:0;
  display:grid;place-items:center;
}
.stage-content{
  width:840px;height:540px;
  position:relative;
  transform-origin:center center;
}

/* ─── MAIN SCREEN ─────────────────────────────────────────────────── */
#scr-main{
  width:840px;height:540px;
  border:7px solid #111880;border-radius:10px;
  overflow:hidden;position:absolute;inset:0;
  background:#FF7022;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}

/* Yellow title bar */
#main-titlebar{
  background:#FFEE00;
  border-bottom:4px solid #000;
  text-align:center;padding:9px 0 7px;
  width:100%;
}
#main-title{
  font-size:25px;color:#FF1111;
  -webkit-text-stroke:2.5px #000;
  letter-spacing:1.5px;line-height:1;
}

/* Category buttons */
.cat-btn{
  position:absolute;display:flex;align-items:center;
  border:4px solid #000;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:38px;letter-spacing:2px;
  user-select:none;overflow:visible;
  transition:transform .12s,box-shadow .12s;
  box-shadow:5px 5px 0 #000;
}
.cat-btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.cat-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}

.btn-mammals{
  background:#9933CC;color:#FFFF00;border-radius:8px;
  left:26px;top:65px;padding:6px 28px 6px 6px;gap:4px;
}
.btn-reptiles{
  background:#D4D400;color:#004400;border-radius:8px;
  left:26px;top:185px;padding:6px 28px 6px 6px;gap:4px;
}
.btn-birds{
  background:#009999;color:#001A66;border-radius:10px;
  right:26px;top:65px;padding:6px 58px 6px 6px;gap:4px;
}
.btn-amphibians{
  background:#FF77AA;color:#770022;border-radius:50px;
  left:90px;top:295px;
  padding:8px 26px 8px 10px;gap:6px;
}
.btn-fish{
  background:#00CCEE;color:#002266;border-radius:50px;
  right:90px;top:295px;padding:8px 28px 8px 8px;gap:4px;
}
.btn-all{
  background:#00AA99;color:#FFFF00;border-radius:8px;
  left:50%;transform:translateX(-50%);bottom:28px;
  padding:8px 28px 8px 8px;gap:6px;
  width:440px;justify-content:center;
}
.btn-all:hover{transform:translateX(-50%) translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.btn-all:active{transform:translateX(-50%) translate(2px,2px);box-shadow:2px 2px 0 #000}

#main-credit{
  position:absolute;bottom:8px;right:14px;
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  color:#881800;letter-spacing:.5px;
}

/* ─── PAINT SCREEN ────────────────────────────────────────────────── */
#scr-paint{
  display:none;width:840px;height:540px;
  border:7px solid #111880;border-radius:10px;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  position:absolute;inset:0;
}

/* Left panel */
#paint-left{
  width:165px;min-width:165px;background:#141C6E;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
}
#left-title{
  width:100%;background:#FFD700;border-bottom:4px solid #000;
  text-align:center;padding:7px 0 5px;
  font-size:16px;color:#000;letter-spacing:1px;
}
#left-tools{
  display:flex;gap:10px;padding:6px 0 5px;align-items:center;
}
.tool-btn{
  width:40px;height:40px;background:transparent;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .1s;border-radius:6px;
}
.tool-btn:hover{transform:scale(1.14);background:rgba(255,255,255,.1)}
#color-preview{
  width:148px;height:16px;background:#FF0000;
  border:3px solid #000;border-radius:3px;margin-bottom:5px;
}
#palette-grid{
  display:grid;grid-template-columns:repeat(6,23px);gap:2px;
  padding:0 6px;
}
.swatch{
  width:23px;height:23px;cursor:pointer;
  border:2px solid rgba(0,0,0,.35);border-radius:2px;
  transition:transform .12s;
}
.swatch:hover{transform:scale(1.15)}
.swatch.active{
  border:2.5px solid #FFF;
  outline:1.5px solid #000;
  transform:scale(1.22);
  z-index:1;position:relative;
}
#drag-label{
  color:#66BBFF;font-size:14px;letter-spacing:2px;font-weight:700;
  margin:7px 0 4px;text-shadow:0 1px 3px #000;
}
#sticker-src{
  width:90px;height:90px;cursor:grab;
  display:flex;align-items:center;justify-content:center;
  border:2px dashed rgba(255,255,255,.45);border-radius:10px;
  background:rgba(255,255,255,.06);
  transition:background .15s;
}
#sticker-src:hover{background:rgba(255,255,255,.12)}
#sticker-src:active{cursor:grabbing}
#btn-more{
  margin:6px auto;width:154px;
  background:#0044DD;color:#FFEE00;
  border:3px solid #000;border-radius:8px;
  font-family:'Fredoka One',cursive;font-size:12.5px;
  padding:6px 4px;cursor:pointer;text-align:center;
  transition:background .12s;
  box-shadow:3px 3px 0 #000;letter-spacing:.5px;
}
#btn-more:hover{background:#0055FF}

/* Right panel */
#paint-right{flex:1;background:#BFCED8;display:flex;flex-direction:column}
#paint-topbar{
  display:flex;align-items:center;padding:4px 14px;
  background:#141C6E;gap:14px;min-height:34px;
  border-bottom:2px solid #000;
}
#btn-back{
  color:#FFDD00;background:none;border:none;
  font-family:'Fredoka One',cursive;font-size:15px;cursor:pointer;
  text-shadow:1px 1px 0 #000;letter-spacing:.5px;
}
#btn-back:hover{color:#FFF}
#topbar-cat{
  color:#FFD700;font-size:18px;letter-spacing:2px;
  -webkit-text-stroke:1px #000;
}
#paint-canvas-wrap{
  flex:1;background:white;
  background-image:
    linear-gradient(rgba(150,180,210,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,180,210,.12) 1px,transparent 1px);
  background-size:28px 28px;
  border-top:3px solid #111880;
  position:relative;overflow:hidden;
}
#animal-svg{width:100%;height:100%;display:block}

/* SVG colorable regions */
.colorable{
  fill:white;stroke:#111;stroke-width:2.5;
  stroke-linejoin:round;stroke-linecap:round;
  cursor:crosshair;transition:filter .1s;
}
.colorable:hover{filter:brightness(.78) saturate(1.1)}

/* Placed stickers */
.placed-sticker{position:absolute;cursor:move;user-select:none;z-index:10}
</style>
</head>

// ─── SVG SCENE HELPERS ────────────────────────────────────────────────────────
const C = `class="colorable"`;  // shorthand
const ST = `stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"`;

function flowerSVG(x, y, r=10) {
  const petals = [0,60,120,180,240,300].map(a =>
    `<ellipse ${C} cx="${(x+Math.sin(a*Math.PI/180)*(r+8)).toFixed(1)}" cy="${(y-Math.cos(a*Math.PI/180)*(r+8)).toFixed(1)}" rx="8" ry="${r}" fill="white" ${ST} transform="rotate(${a},${(x+Math.sin(a*Math.PI/180)*(r+8)).toFixed(1)},${(y-Math.cos(a*Math.PI/180)*(r+8)).toFixed(1)})"/>`
  ).join('');
  return petals + `<circle ${C} cx="${x}" cy="${y}" r="${r}" fill="white" ${ST}/>`;
}

function titleText(text) {
  return `<text x="330" y="50" text-anchor="middle" font-family="Fredoka One,cursive" font-size="50"
    fill="white" stroke="#000" stroke-width="4" paint-order="stroke">${text}</text>`;
}

// ─── PALETTE BUILD ────────────────────────────────────────────────────────────
function buildPalette() {
  const grid = document.getElementById('palette-grid');
  PALETTE.forEach((hex) => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = hex;
    sw.title = hex;
    sw.addEventListener('click', function() {
      selectedColor = hex;
      document.getElementById('color-preview').style.background = hex;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      this.classList.add('active');
    });
    grid.appendChild(sw);
  });
  // default select red (#CC0000 index 9)
  grid.children[9].classList.add('active');
}

const BUILDERS = {
  mammals:    buildMammalsSVG,

  amphibians: buildAmphibiansSVG,

function goTo(cat) {
  curCat = cat;
  stickerIdx = 0;
  // build SVG scene
  const svg = document.getElementById('animal-svg');
  svg.innerHTML = BUILDERS[cat]();
  // attach color-click to all colorable elements
  svg.querySelectorAll('.colorable').forEach(el => {
    el.addEventListener('click', () => { el.style.fill = selectedColor; });
  });
  // sticker
  showSticker(0);
  // topbar
  document.getElementById('topbar-cat').textContent = cat.toUpperCase();
  // switch screens
  document.getElementById('scr-main').style.display = 'none';
  document.getElementById('scr-paint').style.display = 'flex';
  // clear old stickers
  document.querySelectorAll('.placed-sticker').forEach(s => s.remove());
}

function goToMain() {
  document.getElementById('scr-paint').style.display = 'none';
  document.getElementById('scr-main').style.display = 'block';
}

function clearAll() {
  document.querySelectorAll('#animal-svg .colorable').forEach(el => {
    el.style.fill = '';
  });
  document.querySelectorAll('.placed-sticker').forEach(s => s.remove());
}

  stickerIdx = ((idx % 3) + 3) % 3;
  document.getElementById('sticker-src').innerHTML = STICKERS[curCat][stickerIdx];
}
function nextSticker() {
  showSticker(stickerIdx + 1);
}

// ─── STICKER DRAG + DROP (pointer-based: works on mouse and touch) ───────────
// Returns the current CSS scale of the stage container by comparing the post-
// transform rect to the unscaled offsetWidth.
function stageScale() {
  const stage = document.querySelector('.stage-content');
  if (!stage) return 1;
  const r = stage.getBoundingClientRect();
  return (r.width / stage.offsetWidth) || 1;
}

(function () {
  const src = document.getElementById('sticker-src');
  const wrap = document.getElementById('paint-canvas-wrap');
  let dragging = false;
  let ghost = null;

  src.setAttribute('draggable', 'false'); // disable HTML5 drag
  src.style.touchAction = 'none';

  src.addEventListener('pointerdown', e => {
    if (!src.innerHTML) return;
    e.preventDefault();
    dragSvg = src.innerHTML;
    dragging = true;
    ghost = document.createElement('div');
    ghost.style.cssText =
      'position:fixed;pointer-events:none;width:84px;height:84px;' +
      'transform:translate(-50%,-50%);opacity:.85;z-index:9999';
    ghost.innerHTML = dragSvg;
    document.body.appendChild(ghost);
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
    try { src.setPointerCapture(e.pointerId); } catch (_) {}
  });

  src.addEventListener('pointermove', e => {
    if (!dragging) return;
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
  });

  function finishDrag(e) {
    if (!dragging) return;
    dragging = false;
    if (ghost) { ghost.remove(); ghost = null; }
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (target && (target === wrap || wrap.contains(target))) {
      stickerDrop({ clientX: e.clientX, clientY: e.clientY });
    }
  }
  src.addEventListener('pointerup', finishDrag);
  src.addEventListener('pointercancel', finishDrag);
})();

function stickerDrop(e) {
  const wrap = document.getElementById('paint-canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const s = stageScale();
  const x = (e.clientX - rect.left) / s - 42;
  const y = (e.clientY - rect.top)  / s - 42;
  const div = document.createElement('div');
  div.className = 'placed-sticker';
  div.style.left = Math.max(0, x) + 'px';
  div.style.top  = Math.max(0, y) + 'px';
  div.innerHTML  = dragSvg;
  wrap.appendChild(div);
  makeDraggable(div);
}

function makeDraggable(el) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    const wrap = document.getElementById('paint-canvas-wrap');
    const wr = wrap.getBoundingClientRect();
    const s = stageScale();
    // pointer position in wrap-local (unscaled) coords:
    const px0 = (e.clientX - wr.left) / s;
    const py0 = (e.clientY - wr.top)  / s;
    const ox = px0 - el.offsetLeft;
    const oy = py0 - el.offsetTop;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    function move(ev) {
      const px = (ev.clientX - wr.left) / s;
      const py = (ev.clientY - wr.top)  / s;
      el.style.left = (px - ox) + 'px';
      el.style.top  = (py - oy) + 'px';
    }
    function up() {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
    }
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildPalette();
document.getElementById('color-preview').style.background = selectedColor;

// ─── SCALE-TO-FIT ────────────────────────────────────────────────────────────
(function () {
  const stage = document.querySelector('.stage-content');
  const baseW = stage.offsetWidth, baseH = stage.offsetHeight;
  function fitStage() {
    const s = Math.min(window.innerWidth / baseW, window.innerHeight / baseH);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  fitStage();
})();
</script>
